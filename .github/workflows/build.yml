name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android ze_info
      - run: cp main.dart ze_info/lib/main.dart
      - run: sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' ze_info/android/app/src/main/AndroidManifest.xml
      - run: cd ze_info && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ze-info-apk
          path: ze_info/build/app/outputs/flutter-apk/app-release.apk
